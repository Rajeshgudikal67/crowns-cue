/* --- 17. PURE SVG CHART RENDERER (NO EXTERNAL LIBRARIES) --- */
const ChartRenderer = {
  barChart(items, { height = 210, colors = ['#087F5B', '#3867D6', '#7C3AED', '#EA580C', '#0D9488'] } = {}) {
    if (!items.length) return '<div class="empty-state" style="padding:24px">No data in selected date range.</div>';
    const maxVal = Math.max(...items.map(i => i.value), 1);
    const barW = Math.max(38, Math.min(68, Math.floor(520 / items.length) - 14));
    const width = Math.max(360, items.length * (barW + 18) + 40);
    const chartH = height - 48;

    return `
      <div class="chart-box">
        <svg width="100%" viewBox="0 0 ${width} ${height}" style="max-height:${height}px">
          ${items.map((it, idx) => {
            const h = Math.max(3, (it.value / maxVal) * (chartH - 18));
            const x = 24 + idx * (barW + 18);
            const y = chartH - h;
            const color = it.color || colors[idx % colors.length];
            const label = it.label.length > 11 ? it.label.slice(0, 10) + '…' : it.label;
            return `
              <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="6" fill="${color}" opacity="0.92">
                <title>${Utils.esc(it.label)}: ${Utils.money(it.value)}</title>
              </rect>
              <text x="${x + barW / 2}" y="${y - 6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text-primary)">${Utils.moneyShort(it.value)}</text>
              <text x="${x + barW / 2}" y="${chartH + 18}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${Utils.esc(label)}</text>
            `;
          }).join('')}
        </svg>
      </div>
    `;
  },

  donutChart(segments) {
    const total = segments.reduce((s, x) => s + x.value, 0);
    if (!total) return '<div class="empty-state" style="padding:24px">No data in selected range.</div>';
    const r = 64, cx = 86, cy = 86, circ = 2 * Math.PI * r;
    let offset = 0;
    const circles = segments.filter(s => s.value > 0).map(seg => {
      const dash = (seg.value / total) * circ;
      const el = `<circle r="${r}" cx="${cx}" cy="${cy}" fill="transparent" stroke="${seg.color}" stroke-width="24" stroke-dasharray="${dash} ${circ - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"><title>${Utils.esc(seg.label)}: ${Utils.money(seg.value)}</title></circle>`;
      offset += dash;
      return el;
    }).join('');

    return `
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <svg width="172" height="172" viewBox="0 0 172 172">
          <circle r="${r}" cx="${cx}" cy="${cy}" fill="transparent" stroke="var(--bg-hover)" stroke-width="24" />
          ${circles}
          <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">Total</text>
          <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--text-primary)">${Utils.moneyShort(total)}</text>
        </svg>
        <div style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:150px">
          ${segments.map(s => `
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
              <span><span class="legend-dot" style="background:${s.color}"></span>${Utils.esc(s.label)}</span>
              <strong>${Utils.money(s.value)} (${Math.round((s.value / total) * 100)}%)</strong>
            </div>`).join('')}
        </div>
      </div>
    `;
  }
};

  computeMetrics(filter, cStart, cEnd) {
    const d = AppState.data;
    const invs = d.invoices.filter(i => Utils.inDateRange(i.createdAt, filter, cStart, cEnd));
    const pays = d.payments.filter(p => Utils.inDateRange(p.createdAt, filter, cStart, cEnd));
    const ords = d.orders.filter(o => o.orderStatus !== 'Cancelled' && Utils.inDateRange(o.createdAt, filter, cStart, cEnd));
    const exps = d.expenses.filter(e => Utils.inDateRange(new Date(e.date + 'T12:00:00').getTime(), filter, cStart, cEnd));
    const newCusts = d.customers.filter(c => Utils.inDateRange(c.registeredAt, filter, cStart, cEnd));

    const revenue = Utils.round2(invs.reduce((s, i) => s + i.grandTotal, 0));
    const collections = Utils.round2(pays.reduce((s, p) => s + p.amount, 0));
    const sessionRev = Utils.round2(invs.reduce((s, i) => s + (i.sessionCharge || 0), 0));
    const cafeRev = Utils.round2(invs.reduce((s, i) => s + (i.cafeCharge || 0), 0));
    const cashColl = Utils.round2(pays.filter(p => p.method === 'Cash').reduce((s, p) => s + p.amount, 0));
    const upiColl = Utils.round2(pays.filter(p => p.method === 'UPI').reduce((s, p) => s + p.amount, 0));

    const expenseTotal = Utils.round2(exps.reduce((s, e) => s + e.amount, 0));
    const estProfit = Utils.round2(revenue - expenseTotal);

                <tr><td>Actual Cash + UPI Collections</td><td style="text-align:right"><strong>${Utils.money(m.collections)}</strong></td></tr>
                <tr><td>Operating Expenses</td><td style="text-align:right"><strong style="color:var(--danger)">${Utils.money(m.expenseTotal)}</strong></td></tr>

};

/* --- 19. SETTINGS MANAGER --- */
const SettingsManager = {
  applyTheme() {
    const t = AppState.data.settings.theme || 'light';
    document.documentElement.setAttribute('data-theme', t);
    const btn = document.getElementById('themeToggleBtn');
    if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
  },
  toggleTheme() {
    AppState.data.settings.theme = AppState.data.settings.theme === 'dark' ? 'light' : 'dark';
    StorageManager.saveData();
    this.applyTheme();
  },
  saveSettings(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const s = AppState.data.settings;
    s.shopName = (fd.get('shopName') || 'CROWNS CUE').trim();
    s.address = (fd.get('address') || '').trim();
    s.phone = (fd.get('phone') || '').trim();
    s.currency = (fd.get('currency') || '₹').trim();
    s.taxRate = Number(fd.get('taxRate')) || 0;
    s.billingMethod = fd.get('billingMethod');
    s.minSessionCharge = Number(fd.get('minSessionCharge')) || 0;
    s.receiptFooter = (fd.get('receiptFooter') || '').trim();
    s.whatsappGroupLink = (fd.get('whatsappGroupLink') || '').trim();
    s.loyaltyEnabled = fd.get('loyaltyEnabled') === 'on';
    s.loyaltySpendPerPoint = Math.max(1, Number(fd.get('loyaltySpendPerPoint')) || 100);
    s.loyaltyPointValue = Math.max(1, Number(fd.get('loyaltyPointValue')) || 5);
    s.allowNegativeStock = fd.get('allowNegativeStock') === 'on';
    s.theme = fd.get('theme');
    StorageManager.saveData();
    this.applyTheme();
    NavigationManager.renderSidebar();
    NotificationManager.toast('Settings saved successfully.');
  },
  render(ws) {
    const s = AppState.data.settings;
    ws.innerHTML = `
      <div class="page-header">
        <div><div class="page-title">Settings & Data Backup</div><div class="page-subtitle">Configure club branding, billing rules, loyalty program, theme & localStorage backup</div></div>
      </div>

      <div class="grid grid-2">
        <form class="card" onsubmit="SettingsManager.saveSettings(event)">
          <div class="card-header"><div class="card-title">Business, Billing & Loyalty Configuration</div></div>
          <div class="form-grid">
            <div class="form-group"><label class="form-label">Shop / Club Name</label><input class="form-control" name="shopName" value="${Utils.esc(s.shopName)}" /></div>
            <div class="form-group"><label class="form-label">Contact Number</label><input class="form-control" name="phone" value="${Utils.esc(s.phone)}" /></div>
            <div class="form-group full"><label class="form-label">Business Address</label><input class="form-control" name="address" value="${Utils.esc(s.address)}" /></div>
            <div class="form-group"><label class="form-label">Currency Symbol</label><input class="form-control" name="currency" value="${Utils.esc(s.currency)}" /></div>
            <div class="form-group"><label class="form-label">Tax / GST (%)</label><input class="form-control" type="number" step="0.1" min="0" name="taxRate" value="${s.taxRate}" /></div>
            <div class="form-group"><label class="form-label">Default Session Billing</label>
              <select class="form-control" name="billingMethod">
                <option value="per_minute" ${s.billingMethod === 'per_minute' ? 'selected' : ''}>Per Minute</option>
                <option value="30_min" ${s.billingMethod === '30_min' ? 'selected' : ''}>Every 30 Minutes</option>
                <option value="hourly" ${s.billingMethod === 'hourly' ? 'selected' : ''}>Hourly</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Minimum Session Charge (₹)</label><input class="form-control" type="number" min="0" name="minSessionCharge" value="${s.minSessionCharge}" /></div>
            <div class="form-group full"><label class="form-label">WhatsApp Group Link</label><input class="form-control" name="whatsappGroupLink" value="${Utils.esc(s.whatsappGroupLink)}" /></div>
            <div class="form-group full"><label class="form-label">Receipt Footer Message</label><input class="form-control" name="receiptFooter" value="${Utils.esc(s.receiptFooter)}" /></div>
            <div class="form-group"><label class="form-label">Spend per 1 Loyalty Pt (₹)</label><input class="form-control" type="number" min="1" name="loyaltySpendPerPoint" value="${s.loyaltySpendPerPoint}" /></div>
            <div class="form-group"><label class="form-label">1 Loyalty Pt Value (₹)</label><input class="form-control" type="number" min="1" name="loyaltyPointValue" value="${s.loyaltyPointValue}" /></div>
            <div class="form-group"><label class="form-label">Theme Preference</label>
              <select class="form-control" name="theme">
                <option value="light" ${s.theme === 'light' ? 'selected' : ''}>Bright Light Theme (Default)</option>
                <option value="dark" ${s.theme === 'dark' ? 'selected' : ''}>Dark Theme</option>
              </select>
            </div>
            <div class="form-group" style="justify-content:center">
              <label style="display:flex;align-items:center;gap:8px;margin-top:14px"><input type="checkbox" name="loyaltyEnabled" ${s.loyaltyEnabled ? 'checked' : ''} /> Enable Loyalty Program</label>
              <label style="display:flex;align-items:center;gap:8px;margin-top:6px"><input type="checkbox" name="allowNegativeStock" ${s.allowNegativeStock ? 'checked' : ''} /> Allow Negative Stock</label>
            </div>
          </div>
          <div style="margin-top:16px"><button class="btn btn-primary" type="submit">💾 Save Settings</button></div>
        </form>

        <div class="card">
          <div class="card-header"><div class="card-title">LocalStorage Backup & Data Management</div></div>
          <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px">
            <strong>Frontend-Only Storage Notice:</strong> All Crowns Cue data is persisted locally in this browser's <code>localStorage</code>. Data does not automatically synchronize across devices. Export a JSON backup regularly.
          </p>
          <div style="display:flex;flex-direction:column;gap:12px">
            <button class="btn btn-primary" onclick="StorageManager.exportBackup()">⬇️ Export JSON Backup</button>
            <label class="btn btn-outline" style="cursor:pointer">
              ⬆️ Import JSON Backup
              <input type="file" accept="application/json" style="display:none" onchange="StorageManager.importBackup(this.files[0])" />
            </label>
            <hr style="border:none;border-top:1px solid var(--border-color)" />
            <button class="btn btn-danger" onclick="StorageManager.resetDemoData()">🔄 Reset to Initial Demo Data</button>
          </div>
        </div>
      </div>
    `;
  }
};

/* --- 20. GLOBAL SEARCH & APP BOOTSTRAP --- */
function handleGlobalSearch(query) {
  const dd = document.getElementById('globalSearchDropdown');
  const q = query.trim().toLowerCase();
  if (!q) { dd.classList.remove('open'); return; }
  const d = AppState.data;
  const results = [];

  d.customers.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(Utils.normalizePhone(q) || q)).slice(0, 4).forEach(c => {
    results.push({ label: `👤 ${c.name}`, sub: Utils.formatPhone(c.phone), action: `CustomerManager.openProfileModal('${c.id}')` });
  });
  d.tables.filter(t => t.name.toLowerCase().includes(q)).slice(0, 3).forEach(t => {
    results.push({ label: `🎱 ${t.name}`, sub: `${t.status.toUpperCase()} • ${Utils.moneyShort(t.hourlyRate)}/hr`, action: `NavigationManager.go('tables')` });
  });
  d.products.filter(p => p.name.toLowerCase().includes(q)).slice(0, 3).forEach(p => {
    results.push({ label: `☕ ${p.name}`, sub: `${Utils.money(p.price)} • Stock: ${p.stock}`, action: `NavigationManager.go('products')` });
  });
  d.invoices.filter(i => i.id.toLowerCase().includes(q)).slice(0, 3).forEach(i => {
    results.push({ label: `📄 ${i.id}`, sub: `${i.customerName} • ${Utils.money(i.grandTotal)}`, action: `InvoiceManager.openInvoiceModal('${i.id}')` });
  });

  dd.innerHTML = results.length ? results.map(r => `
    <div class="search-result-item" onclick="${r.action};document.getElementById('globalSearchDropdown').classList.remove('open');document.getElementById('globalSearchInput').value=''">
      <div><div style="font-weight:600">${Utils.esc(r.label)}</div><div style="font-size:12px;color:var(--text-secondary)">${Utils.esc(r.sub)}</div></div>
      <span style="font-size:12px;color:var(--brand-emerald)">Open →</span>
    </div>`).join('') : '<div style="padding:14px;font-size:13px;color:var(--text-secondary)">No matching records found.</div>';
  dd.classList.add('open');
}

function initApp() {
  StorageManager.loadData();
  SettingsManager.applyTheme();

  // Sidebar event delegation
  document.getElementById('sidebarNav').addEventListener('click', e => {
    const btn = e.target.closest('[data-nav]');
    if (btn) NavigationManager.go(btn.dataset.nav);
  });

  // Mobile sidebar controls
  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarBackdrop').classList.toggle('open');
  });
  document.getElementById('sidebarBackdrop').addEventListener('click', () => NavigationManager.closeMobileMenu());

  // Theme & Notifications & Modal
  document.getElementById('themeToggleBtn').addEventListener('click', () => SettingsManager.toggleTheme());
  document.getElementById('notifBtn').addEventListener('click', e => { e.stopPropagation(); NotificationManager.togglePopover(); });
  document.getElementById('modalCloseBtn').addEventListener('click', () => NotificationManager.closeModal());
  document.getElementById('modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') NotificationManager.closeModal(); });

  // Global search
  document.getElementById('globalSearchInput').addEventListener('input', e => handleGlobalSearch(e.target.value));
  document.addEventListener('click', e => {
    if (!e.target.closest('.global-search')) document.getElementById('globalSearchDropdown').classList.remove('open');
    if (!e.target.closest('#notifPopover') && !e.target.closest('#notifBtn')) document.getElementById('notifPopover').classList.remove('open');
  });

  // Live Clock & Session Timers (1s tick)
  const updateClock = () => {
    const el = document.getElementById('liveClock');
    if (el) el.textContent = new Date().toLocaleString('en-IN', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    SessionManager.tickLiveTimers();
  };
  updateClock();
  setInterval(updateClock, 1000);

  NavigationManager.render();
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
