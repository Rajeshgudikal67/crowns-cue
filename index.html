<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CROWNS CUE — Snooker Club, Café POS & Business CRM</title>
<style>
/* ============================================================================
   1. DESIGN TOKENS & THEME SYSTEM (BRIGHT DEFAULT + OPTIONAL DARK THEME)
   ============================================================================ */
:root {
  --bg-main: #FFFFFF;
  --bg-workspace: #F3F6FA;
  --bg-card: #FFFFFF;
  --bg-subtle: #F8FAFC;
  --bg-hover: #F1F5F9;

  --brand-emerald: #087F5B;
  --brand-emerald-dark: #066347;
  --brand-emerald-soft: #E6F5F0;
  --brand-blue: #3867D6;
  --brand-blue-soft: #EBF1FC;
  --brand-gold: #D6A84F;
  --brand-gold-soft: #FCF6E8;

  --accent-violet: #7C3AED;
  --accent-violet-soft: #F3EEFE;
  --accent-orange: #EA580C;
  --accent-orange-soft: #FFF1EB;
  --accent-teal: #0D9488;
  --accent-teal-soft: #E6F7F5;
  --accent-coral: #E11D48;
  --accent-coral-soft: #FFEAF0;

  --text-primary: #17243A;
  --text-secondary: #64748B;
  --text-muted: #94A3B8;

  --border-color: #E2E8F0;
  --border-strong: #CBD5E1;

  --success: #16A34A;
  --success-soft: #E9F9EF;
  --warning: #D97706;
  --warning-soft: #FEF5E6;
  --danger: #DC2626;
  --danger-soft: #FEECEC;
  --info: #2563EB;
  --info-soft: #EAF2FF;

  --shadow-xs: 0 1px 2px rgba(23, 36, 58, 0.05);
  --shadow-sm: 0 2px 6px rgba(23, 36, 58, 0.06);
  --shadow-md: 0 6px 18px rgba(23, 36, 58, 0.08);
  --shadow-lg: 0 14px 36px rgba(23, 36, 58, 0.14);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --sidebar-w: 256px;
  --topbar-h: 64px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

[data-theme="dark"] {
  --bg-main: #0F172A;
  --bg-workspace: #0B1120;
  --bg-card: #151F32;
  --bg-subtle: #1B273D;
  --bg-hover: #22304A;
  --brand-emerald-soft: rgba(8, 127, 91, 0.2);
  --brand-blue-soft: rgba(56, 103, 214, 0.2);
  --brand-gold-soft: rgba(214, 168, 79, 0.18);
  --accent-violet-soft: rgba(124, 58, 237, 0.2);
  --accent-orange-soft: rgba(234, 88, 12, 0.2);
  --accent-teal-soft: rgba(13, 148, 136, 0.2);
  --accent-coral-soft: rgba(225, 29, 72, 0.2);
  --text-primary: #F1F5F9;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --border-color: #24324B;
  --border-strong: #334155;
  --success-soft: rgba(22, 163, 74, 0.2);
  --warning-soft: rgba(217, 119, 6, 0.2);
  --danger-soft: rgba(220, 38, 38, 0.2);
  --info-soft: rgba(37, 99, 235, 0.2);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
}

/* ============================================================================
   2. RESET & BASE TYPOGRAPHY
   ============================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font-sans); background: var(--bg-workspace); color: var(--text-primary); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--brand-blue); text-decoration: none; }
img { max-width: 100%; display: block; }

/* ============================================================================
   3. APPLICATION SHELL (SIDEBAR + TOPBAR + MAIN WORKSPACE)
   ============================================================================ */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-main);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 40;
  transition: transform 0.22s ease;
}

.brand-header {
  height: var(--topbar-h);
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 11px;
  border-bottom: 1px solid var(--border-color);
}
.brand-mark {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--brand-emerald);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 800; font-size: 15px;
  box-shadow: 0 3px 10px rgba(8, 127, 91, 0.28);
  position: relative;
}
.brand-mark::after {
  content: "";
  position: absolute;
  top: 3px; right: 3px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--brand-gold);
}
.brand-name { font-weight: 800; font-size: 15px; letter-spacing: 0.6px; color: var(--text-primary); line-height: 1.15; }
.brand-sub { font-size: 11px; color: var(--text-secondary); font-weight: 500; }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 10px 24px; }
.nav-group-label {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px;
  color: var(--text-muted); padding: 12px 12px 6px;
}
.nav-item {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-weight: 500; font-size: 13.5px;
  transition: background 0.15s, color 0.15s;
  margin-bottom: 2px;
  text-align: left;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active {
  background: var(--brand-emerald-soft);
  color: var(--brand-emerald);
  font-weight: 600;
}
.nav-item .nav-icon { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }
.nav-badge {
  margin-left: auto;
  font-size: 11px; font-weight: 700;
  padding: 1px 7px; border-radius: 99px;
  background: var(--accent-orange-soft); color: var(--accent-orange);
}

.main-area {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: var(--topbar-h);
  background: var(--bg-main);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  position: sticky; top: 0; z-index: 30;
  gap: 16px;
}
.topbar-left { display: flex; align-items: center; gap: 14px; flex: 1; max-width: 520px; }
.mobile-menu-btn { display: none; font-size: 20px; padding: 6px 8px; border-radius: var(--radius-sm); background: var(--bg-subtle); border: 1px solid var(--border-color); }

.global-search { position: relative; flex: 1; }
.global-search input {
  width: 100%;
  padding: 9px 14px 9px 36px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.global-search input:focus { border-color: var(--brand-emerald); background: var(--bg-main); }
.global-search .search-ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }
.search-dropdown {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  max-height: 360px; overflow-y: auto; z-index: 60; display: none;
}
.search-dropdown.open { display: block; }
.search-result-item {
  padding: 10px 14px; border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; justify-content: space-between; cursor: pointer;
}
.search-result-item:hover { background: var(--bg-hover); }
.search-result-item:last-child { border-bottom: none; }

.topbar-right { display: flex; align-items: center; gap: 12px; }
.live-clock {
  font-size: 12.5px; font-weight: 600; color: var(--text-secondary);
  background: var(--bg-subtle); border: 1px solid var(--border-color);
  padding: 6px 12px; border-radius: var(--radius-sm); white-space: nowrap;
}
.icon-btn {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-color); background: var(--bg-main);
  display: grid; place-items: center; position: relative; font-size: 16px;
  transition: background 0.15s;
}
.icon-btn:hover { background: var(--bg-hover); }
.icon-btn .dot {
  position: absolute; top: 6px; right: 6px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--danger); border: 2px solid var(--bg-main);
}
.profile-chip {
  display: flex; align-items: center; gap: 9px;
  padding: 4px 10px 4px 5px; border-radius: 99px;
  border: 1px solid var(--border-color); background: var(--bg-subtle);
}
.profile-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand-emerald); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 12px;
}

.workspace { padding: 24px; flex: 1; max-width: 1540px; width: 100%; margin: 0 auto; }

/* ============================================================================
   4. REUSABLE UI COMPONENTS (CARDS, BUTTONS, FORMS, TABLES, BADGES, MODALS)
   ============================================================================ */
.page-header {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 14px; margin-bottom: 20px;
}
.page-title { font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }
.page-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.page-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs);
  padding: 18px 20px;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 14px;
}
.card-title { font-size: 15px; font-weight: 700; color: var(--text-primary); }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

/* KPI Metric Cards */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-bottom: 20px; }
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-xs);
  display: flex; flex-direction: column; gap: 8px;
  border-top: 3px solid var(--brand-emerald);
}
.kpi-card.emerald { border-top-color: var(--brand-emerald); }
.kpi-card.blue { border-top-color: var(--brand-blue); }
.kpi-card.violet { border-top-color: var(--accent-violet); }
.kpi-card.orange { border-top-color: var(--accent-orange); }
.kpi-card.green { border-top-color: var(--success); }
.kpi-card.amber { border-top-color: var(--warning); }
.kpi-card.coral { border-top-color: var(--accent-coral); }
.kpi-card.gold { border-top-color: var(--brand-gold); }
.kpi-card.teal { border-top-color: var(--accent-teal); }

.kpi-top { display: flex; align-items: center; justify-content: space-between; }
.kpi-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.kpi-icon {
  width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 15px;
  background: var(--brand-emerald-soft); color: var(--brand-emerald);
}
.kpi-card.blue .kpi-icon { background: var(--brand-blue-soft); color: var(--brand-blue); }
.kpi-card.violet .kpi-icon { background: var(--accent-violet-soft); color: var(--accent-violet); }
.kpi-card.orange .kpi-icon { background: var(--accent-orange-soft); color: var(--accent-orange); }
.kpi-card.green .kpi-icon { background: var(--success-soft); color: var(--success); }
.kpi-card.amber .kpi-icon { background: var(--warning-soft); color: var(--warning); }
.kpi-card.coral .kpi-icon { background: var(--accent-coral-soft); color: var(--accent-coral); }
.kpi-card.gold .kpi-icon { background: var(--brand-gold-soft); color: var(--brand-gold); }
.kpi-card.teal .kpi-icon { background: var(--accent-teal-soft); color: var(--accent-teal); }
.kpi-value { font-size: 22px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.4px; }
.kpi-meta { font-size: 11.5px; color: var(--text-secondary); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 15px; border-radius: var(--radius-sm);
  font-weight: 600; font-size: 13px;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--brand-emerald); color: #fff; }
.btn-primary:hover { background: var(--brand-emerald-dark); }
.btn-blue { background: var(--brand-blue); color: #fff; }
.btn-blue:hover { opacity: 0.92; }
.btn-gold { background: var(--brand-gold); color: #17243A; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline { background: var(--bg-main); border: 1px solid var(--border-strong); color: var(--text-primary); }
.btn-outline:hover { background: var(--bg-hover); }
.btn-soft { background: var(--brand-emerald-soft); color: var(--brand-emerald); }
.btn-soft:hover { opacity: 0.88; }
.btn-sm { padding: 6px 11px; font-size: 12px; }
.btn-xs { padding: 4px 8px; font-size: 11.5px; }
.btn-whatsapp { background: #25D366; color: #fff; }
.btn-whatsapp:hover { background: #1EBE5D; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 99px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
}
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-emerald { background: var(--brand-emerald-soft); color: var(--brand-emerald); }
.badge-gold { background: var(--brand-gold-soft); color: #9A6E1B; }
.badge-neutral { background: var(--bg-hover); color: var(--text-secondary); }

/* Forms */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
.form-control {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--bg-main); color: var(--text-primary); outline: none;
  transition: border-color 0.15s;
}
.form-control:focus { border-color: var(--brand-emerald); box-shadow: 0 0 0 3px var(--brand-emerald-soft); }
textarea.form-control { min-height: 78px; resize: vertical; }
.form-hint { font-size: 11.5px; color: var(--text-secondary); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-card); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--bg-subtle); color: var(--text-secondary);
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
  text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border-color); white-space: nowrap;
}
tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg-subtle); }

/* Filter Bar & Tabs */
.filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.pill-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.pill-tab {
  padding: 6px 13px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-secondary);
}
.pill-tab.active { background: var(--brand-emerald); border-color: var(--brand-emerald); color: #fff; }

/* Snooker Table Visual Cards */
.table-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-xs);
  display: flex; flex-direction: column; gap: 10px;
  position: relative;
  border-left: 4px solid var(--success);
  transition: box-shadow 0.15s, transform 0.15s;
}
.table-card:hover { box-shadow: var(--shadow-md); }
.table-card.occupied { border-left-color: var(--accent-orange); background: linear-gradient(180deg, var(--bg-card) 0%, var(--accent-orange-soft) 240%); }
.table-card.maintenance { border-left-color: var(--text-muted); opacity: 0.85; }
.table-timer {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 20px; font-weight: 800; color: var(--brand-emerald);
  background: var(--brand-emerald-soft); padding: 6px 10px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: space-between;
}
.table-card.occupied .table-timer { color: var(--accent-orange); background: var(--accent-orange-soft); }

/* POS Split Layout */
.pos-layout { display: grid; grid-template-columns: 1fr 380px; gap: 18px; align-items: start; }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
.product-card {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
}
.product-card:hover { border-color: var(--brand-emerald); box-shadow: var(--shadow-sm); }
.product-card.out-of-stock { opacity: 0.55; }
.product-thumb {
  height: 86px; border-radius: var(--radius-sm); background: var(--bg-subtle);
  display: grid; place-items: center; font-size: 28px; overflow: hidden;
}
.product-thumb img { width: 100%; height: 100%; object-fit: cover; }
.cart-panel { position: sticky; top: calc(var(--topbar-h) + 16px); }
.cart-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 0; border-bottom: 1px solid var(--border-color);
}
.qty-control { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-subtle); border: 1px solid var(--border-color); border-radius: 6px; padding: 2px; }
.qty-control button { width: 24px; height: 24px; border-radius: 4px; font-weight: 700; display: grid; place-items: center; }
.qty-control button:hover { background: var(--bg-hover); }

/* Modal & Drawer */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
  display: none; align-items: center; justify-content: center;
  padding: 18px; z-index: 100; backdrop-filter: blur(2px);
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 660px; max-height: 90vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal.modal-lg { max-width: 860px; }
.modal-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 20px; border-top: 1px solid var(--border-color);
  display: flex; justify-content: flex-end; gap: 10px; background: var(--bg-subtle);
}

/* Toast Notifications */
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 150; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
.toast {
  background: var(--text-primary); color: var(--bg-main);
  padding: 12px 16px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px;
  border-left: 4px solid var(--brand-emerald);
}
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }

/* Notification Panel */
.notif-popover {
  position: absolute; top: calc(var(--topbar-h) + 6px); right: 24px; width: 340px;
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); z-index: 80; display: none; overflow: hidden;
}
.notif-popover.open { display: block; }

/* Charts */
.chart-box { width: 100%; overflow-x: auto; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; }

/* Thermal Receipt Preview */
.receipt-paper {
  max-width: 340px; margin: 0 auto; background: #fff; color: #111;
  border: 1px dashed #cbd5e1; padding: 18px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px; line-height: 1.45;
}

    if (str === null || str === undefined) return '';

      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  },
  uid(prefix = 'ID') {
    return `${prefix}_${Date.now().toString(36).toUpperCase()}_${Math.random().toString(36).slice(2, 6).toUpperCase()}`;

  money(val) {
    const n = Number(val) || 0;
    const sym = (AppState.data && AppState.data.settings && AppState.data.settings.currency) || '₹';
    return `${sym}${n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  },
  moneyShort(val) {
    const n = Number(val) || 0;
    const sym = (AppState.data && AppState.data.settings && AppState.data.settings.currency) || '₹';
    return `${sym}${n.toLocaleString('en-IN', { maximumFractionDigits: 0 })}`;
  },
  normalizePhone(input) {
    if (!input) return '';
    let digits = String(input).replace(/\D/g, '');
    if (digits.length === 12 && digits.startsWith('91')) digits = digits.slice(2);
    if (digits.length === 11 && digits.startsWith('0')) digits = digits.slice(1);
    return digits;
  },
  isValidIndianPhone(input) {
    const d = this.normalizePhone(input);
    return /^[6-9]\d{9}$/.test(d);
  },
  formatPhone(phone) {
    const d = this.normalizePhone(phone);
    return d.length === 10 ? `+91 ${d.slice(0,5)} ${d.slice(5)}` : phone;
  },
  formatDate(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  },
  formatDateTime(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
  },
  formatTime(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
  },
  formatDuration(ms) {
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  },
  toISODate(date = new Date()) {
    const d = new Date(date);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  },
  inDateRange(ts, filter, customStart, customEnd) {
    if (!ts) return false;
    const d = new Date(ts);
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const endOfToday = startOfToday + 86400000 - 1;
    if (filter === 'today') return ts >= startOfToday && ts <= endOfToday;
    if (filter === 'yesterday') return ts >= (startOfToday - 86400000) && ts < startOfToday;
    if (filter === '7d') return ts >= (startOfToday - 6 * 86400000) && ts <= endOfToday;
    if (filter === '30d') return ts >= (startOfToday - 29 * 86400000) && ts <= endOfToday;
    if (filter === 'month') {
      const mStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      return ts >= mStart && ts <= endOfToday;
    }
    if (filter === 'custom') {
      const s = customStart ? new Date(customStart + 'T00:00:00').getTime() : 0;
      const e = customEnd ? new Date(customEnd + 'T23:59:59').getTime() : Infinity;
      return ts >= s && ts <= e;
    }
    return true;
  },
  round2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }

  loadData() {
    try {
      const raw = localStorage.getItem(AppConfig.STORAGE_KEY);
      if (!raw) return this.initializeData();
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.settings || !Array.isArray(parsed.tables)) {
        return this.initializeData();
      }
      AppState.data = parsed;
      return parsed;
    } catch (e) {
      console.error('Storage load error:', e);
      return this.initializeData();
    }
  },

  saveData() {
    try {
      localStorage.setItem(AppConfig.STORAGE_KEY, JSON.stringify(AppState.data));
      NotificationManager.updateIndicators();
    } catch (e) {
      console.error('Storage save error:', e);
      NotificationManager.toast('Unable to save to localStorage (storage quota may be full).', 'error');
    }
  },

  initializeData() {
    AppState.data = this.buildDemoData();
    this.saveData();
    return AppState.data;
  },

  resetDemoData() {
    if (!confirm('Reset ALL data back to initial Crowns Cue demo records? Current changes will be lost.')) return;
    AppState.data = this.buildDemoData();
    this.saveData();
    SettingsManager.applyTheme();
    NavigationManager.render();
    NotificationManager.toast('Demo data restored successfully.');
  },

  exportBackup() {
    const blob = new Blob([JSON.stringify(AppState.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `crowns-cue-backup-${Utils.toISODate()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    NotificationManager.toast('JSON backup downloaded.');
  },

  importBackup(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed.settings || !Array.isArray(parsed.customers) || !Array.isArray(parsed.tables)) {
          throw new Error('Invalid backup structure');
        }
        AppState.data = parsed;
        this.saveData();
        SettingsManager.applyTheme();
        NavigationManager.render();
        NotificationManager.toast('Backup restored successfully.');
      } catch (err) {
        NotificationManager.toast('Invalid backup file: ' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  }
};

/* --- 5. NOTIFICATION & MODAL MANAGER --- */
const NotificationManager = {
  toast(message, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => el.remove(), 3500);
  },
  getAlerts() {
    const d = AppState.data;
    const alerts = [];
    d.products.filter(p => p.enabled && p.stock <= p.lowStock).forEach(p => {
      alerts.push({ type: 'warning', title: `Low Stock: ${p.name}`, detail: `Only ${p.stock} left (limit: ${p.lowStock})`, page: 'inventory' });
    });
    const pendingInvs = d.invoices.filter(i => i.pendingBalance > 0);
    if (pendingInvs.length) {
      const sum = pendingInvs.reduce((a, b) => a + b.pendingBalance, 0);
      alerts.push({ type: 'danger', title: `${pendingInvs.length} Pending Invoice(s)`, detail: `Outstanding balance: ${Utils.money(sum)}`, page: 'payments' });
    }
    if (d.activeSessions.length) {
      alerts.push({ type: 'info', title: `${d.activeSessions.length} Active Session(s)`, detail: 'Timers currently running', page: 'active-sessions' });
    }
    return alerts;
  },
  updateIndicators() {
    const alerts = this.getAlerts();
    const dot = document.getElementById('notifDot');
    if (dot) dot.style.display = alerts.length ? 'block' : 'none';
    const badge = document.getElementById('activeSessionNavBadge');
    if (badge) {
      const c = AppState.data.activeSessions.length;
      badge.textContent = c;
      badge.style.display = c ? 'inline-block' : 'none';
    }
  },
  togglePopover() {
    const pop = document.getElementById('notifPopover');
    const isOpen = pop.classList.toggle('open');
    if (!isOpen) return;
    const alerts = this.getAlerts();
    pop.innerHTML = `
      <div style="padding:12px 14px;border-bottom:1px solid var(--border-color);font-weight:700;display:flex;justify-content:space-between">
        <span>Alerts & Activity</span><span class="badge badge-neutral">${alerts.length}</span>
      </div>
      <div style="max-height:320px;overflow-y:auto">
        ${alerts.length ? alerts.map(a => `
          <div class="search-result-item" onclick="NavigationManager.go('${a.page}');document.getElementById('notifPopover').classList.remove('open')">
            <div>
              <div style="font-weight:600;font-size:13px">${Utils.esc(a.title)}</div>
              <div style="font-size:12px;color:var(--text-secondary)">${Utils.esc(a.detail)}</div>
            </div>
            <span class="badge badge-${a.type}">View</span>
          </div>
        `).join('') : '<div class="empty-state" style="padding:20px">All clear! No pending alerts.</div>'}
      </div>
    `;
  },
  openModal(title, bodyHtml, footerHtml = '', large = false) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml;
    document.getElementById('modalBox').classList.toggle('modal-lg', large);
    document.getElementById('modalBackdrop').classList.add('open');
  },
  closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
  }
};

/* --- 7. CUSTOMER MANAGER & UNIQUE PHONE IDENTIFICATION --- */
const CustomerManager = {
  findByPhone(rawPhone) {
    const norm = Utils.normalizePhone(rawPhone);
    if (!norm) return null;
    return AppState.data.customers.find(c => Utils.normalizePhone(c.phone) === norm) || null;
  },

  findById(id) {
    return AppState.data.customers.find(c => c.id === id) || null;
  },

  register({ name, phone, birthday = '', notes = '' }) {
    const cleanName = (name || '').trim();
    const normPhone = Utils.normalizePhone(phone);
    if (!cleanName) return { error: 'Customer name is required.' };
    if (!Utils.isValidIndianPhone(normPhone)) return { error: 'Enter a valid 10-digit Indian mobile number (starts with 6–9).' };
    const existing = this.findByPhone(normPhone);
    if (existing) return { error: `Mobile number already registered to ${existing.name} (${existing.id}).` };

    const customer = {
      id: Utils.uid('CUST'),
      name: cleanName,
      phone: normPhone,
      birthday,
      notes: notes.trim(),
      registeredAt: Date.now(),
      loyaltyPoints: 0,
      isDemo: false
    };
    AppState.data.customers.unshift(customer);
    StorageManager.saveData();
    return { customer };
  },

  update(id, { name, phone, birthday, notes }) {
    const cust = this.findById(id);
    if (!cust) return { error: 'Customer not found.' };
    const normPhone = Utils.normalizePhone(phone);
    if (!name.trim()) return { error: 'Name is required.' };
    if (!Utils.isValidIndianPhone(normPhone)) return { error: 'Invalid 10-digit Indian mobile number.' };
    const dup = AppState.data.customers.find(c => c.id !== id && Utils.normalizePhone(c.phone) === normPhone);
    if (dup) return { error: `Phone number already belongs to ${dup.name}.` };

    cust.name = name.trim();
    cust.phone = normPhone;
    cust.birthday = birthday || '';
    cust.notes = (notes || '').trim();
    StorageManager.saveData();
    return { customer: cust };
  },

  getStats(customerId) {
    const d = AppState.data;
    const invoices = d.invoices.filter(i => i.customerId === customerId);
    const sessions = d.completedSessions.filter(s => s.customerId === customerId);
    const orders = d.orders.filter(o => o.customerId === customerId && o.orderStatus !== 'Cancelled');
    const payments = d.payments.filter(p => p.customerId === customerId);

    const lifetimeSpend = Utils.round2(invoices.reduce((s, i) => s + i.grandTotal, 0));
    const outstanding = Utils.round2(invoices.reduce((s, i) => s + i.pendingBalance, 0));
    const totalVisits = invoices.length;
    const avgBill = totalVisits ? Utils.round2(lifetimeSpend / totalVisits) : 0;
    const totalSessionHours = Utils.round2(sessions.reduce((s, x) => s + ((x.durationMs || 0) / 3600000), 0));
    const lastTx = invoices.length ? Math.max(...invoices.map(i => i.createdAt)) : null;

    // Frequently purchased products
    const freq = {};
    orders.forEach(o => o.items.forEach(it => { freq[it.name] = (freq[it.name] || 0) + it.qty; }));
    const topProducts = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 3);

    // Available customer offers
    const cust = this.findById(customerId);
    const eligibleOffers = OfferManager.getCustomerAvailableOffers(cust, totalVisits);

    return {
      invoices, sessions, orders, payments,
      lifetimeSpend, outstanding, totalVisits,
      totalSessions: sessions.length,
      totalOrders: orders.length,
      avgBill, totalSessionHours, lastTx, topProducts, eligibleOffers
    };
  },

const CustomerSearchManager = {
  renderLookupWidget(containerId, { selectedId, onSelectFnName, allowGuest = true }) {
    const selected = selectedId === 'GUEST' ? { id: 'GUEST', name: 'Walk-in Guest', phone: 'Guest Checkout' } : CustomerManager.findById(selectedId);

          <div class="card-title">1. Customer Identification (Mobile Number)</div>

        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">

            <div style="font-weight:800;font-size:15px;color:var(--text-primary)">✅ ${Utils.esc(c.name)} <span class="badge badge-gold">⭐ ${c.loyaltyPoints || 0} pts</span></div>

          <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px">
            <span>Visits: <strong>${st.totalVisits}</strong></span>
            <span>Sessions: <strong>${st.totalSessions}</strong></span>
            <span>Orders: <strong>${st.totalOrders}</strong></span>
            <span>Lifetime Spend: <strong>${Utils.money(st.lifetimeSpend)}</strong></span>
            <span>Last Visit: <strong>${Utils.formatDate(st.lastTx)}</strong></span>
            <span>Outstanding: <strong style="color:${st.outstanding > 0 ? 'var(--danger)' : 'var(--success)'}">${Utils.money(st.outstanding)}</strong></span>

      </div>
    `;
  },

  handleInput(containerId, onSelectFnName, showError = false) {
    const raw = document.getElementById(`${containerId}_phone`).value;
    const norm = Utils.normalizePhone(raw);
    const resEl = document.getElementById(`${containerId}_result`);
    if (norm.length < 4) {
      if (showError) NotificationManager.toast('Enter at least 10 digits for mobile lookup.', 'warning');
      return;
    }
    const exact = CustomerManager.findByPhone(norm);
    if (exact) {
      const st = CustomerManager.getStats(exact.id);
      resEl.innerHTML = `
        <div style="padding:14px;border-radius:var(--radius-md);background:var(--bg-subtle);border:1px solid var(--border-strong)">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
            <div>
              <div style="font-weight:700;font-size:15px">${Utils.esc(exact.name)} <span class="badge badge-emerald">Existing Customer</span></div>
              <div style="font-size:12.5px;color:var(--text-secondary)">${Utils.formatPhone(exact.phone)} • ${exact.id} • Visits: ${st.totalVisits} • Spend: ${Utils.money(st.lifetimeSpend)} • Bal: ${Utils.money(st.outstanding)}</div>
            </div>
            <button class="btn btn-primary" onclick="${onSelectFnName}('${exact.id}')">✓ Select Customer</button>
          </div>
        </div>`;
      return;
    }

    if (norm.length >= 10) {
      if (!Utils.isValidIndianPhone(norm)) {
        resEl.innerHTML = `<div class="badge badge-danger">Invalid Indian mobile number. Must be 10 digits starting with 6, 7, 8, or 9.</div>`;
        return;
      }
      resEl.innerHTML = `
        <div style="padding:14px;border-radius:var(--radius-md);background:var(--brand-gold-soft);border:1px solid var(--brand-gold)">
          <div style="font-weight:700;margin-bottom:8px">New Customer — Register ${Utils.formatPhone(norm)}</div>

            <input class="form-control" style="max-width:260px" id="${containerId}_newName" placeholder="Customer Full Name *" />
            <input class="form-control" style="max-width:170px" type="date" id="${containerId}_newBday" title="Birthday (optional)" />
            <button class="btn btn-primary" onclick="CustomerSearchManager.quickRegister('${containerId}', '${norm}', '${onSelectFnName}')">+ Save & Select</button>
          </div>
        </div>`;
    } else {
      const partials = AppState.data.customers.filter(c => c.phone.includes(norm)).slice(0, 4);
      resEl.innerHTML = partials.length ? partials.map(c => `
        <div class="search-result-item" style="border:1px solid var(--border-color);border-radius:6px;margin-bottom:6px" onclick="${onSelectFnName}('${c.id}')">
          <div><strong>${Utils.esc(c.name)}</strong> <span style="color:var(--text-secondary)">${Utils.formatPhone(c.phone)}</span></div>
          <span class="btn btn-soft btn-xs">Select</span>
        </div>`).join('') : '<div style="font-size:12.5px;color:var(--text-secondary)">Keep typing full 10-digit mobile number to register a new customer...</div>';
    }
  },

  quickRegister(containerId, normPhone, onSelectFnName) {
    const name = document.getElementById(`${containerId}_newName`).value;
    const birthday = document.getElementById(`${containerId}_newBday`).value;
    const res = CustomerManager.register({ name, phone: normPhone, birthday });
    if (res.error) return NotificationManager.toast(res.error, 'error');
    NotificationManager.toast(`Registered ${res.customer.name}!`);
    // Call selector callback via safe path
    const parts = onSelectFnName.split('.');
    window[parts[0]][parts[1]](res.customer.id);
  }
};

/* --- 9. TABLE MANAGER --- */
const TableManager = {
  findById(id) { return AppState.data.tables.find(t => t.id === id) || null; },

  openTableModal(tableId = null) {
    const t = tableId ? this.findById(tableId) : null;
    const html = `
      <form id="tableForm" class="form-grid">
        <div class="form-group">
          <label class="form-label">Table Name *</label>
          <input class="form-control" name="name" required value="${Utils.esc(t ? t.name : '')}" placeholder="e.g. Snooker 05" />
        </div>
        <div class="form-group">
          <label class="form-label">Type *</label>
          <select class="form-control" name="type">
            ${['Snooker', 'Carrom', 'Workstation', 'Pool'].map(tp => `<option value="${tp}" ${t && t.type === tp ? 'selected' : ''}>${tp}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Hourly Rate (₹) *</label>
          <input class="form-control" type="number" min="1" name="hourlyRate" required value="${t ? t.hourlyRate : 120}" />
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-control" name="status" ${t && t.status === 'occupied' ? 'disabled' : ''}>
            <option value="available" ${t && t.status === 'available' ? 'selected' : ''}>Available</option>
            <option value="maintenance" ${t && t.status === 'maintenance' ? 'selected' : ''}>Maintenance</option>
            ${t && t.status === 'occupied' ? '<option value="occupied" selected>Occupied (Active Session)</option>' : ''}
          </select>
        </div>
      </form>
    `;
    NotificationManager.openModal(
      t ? `Edit ${t.name}` : 'Add New Table',
      html,
      `<button class="btn btn-outline" onclick="NotificationManager.closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="TableManager.saveTable('${tableId || ''}')">Save Table</button>`
    );
  },

  saveTable(tableId) {
    const f = document.getElementById('tableForm');
    const data = Object.fromEntries(new FormData(f).entries());
    const rate = Number(data.hourlyRate);
    if (!data.name.trim() || rate <= 0) return NotificationManager.toast('Enter valid table name and hourly rate.', 'error');
    if (tableId) {
      const t = this.findById(tableId);
      t.name = data.name.trim();
      t.type = data.type;
      t.hourlyRate = rate;
      if (t.status !== 'occupied' && data.status) t.status = data.status;
    } else {
      AppState.data.tables.push({
        id: Utils.uid('TBL'), name: data.name.trim(), type: data.type,
        hourlyRate: rate, status: data.status || 'available', activeSessionId: null, isDemo: false
      });
    }
    StorageManager.saveData();
    NotificationManager.closeModal();
    NotificationManager.toast('Table saved.');
    NavigationManager.render();
  },

  deleteTable(tableId) {
    const t = this.findById(tableId);
    if (!t) return;
    if (t.status === 'occupied') return NotificationManager.toast('Cannot delete an occupied table.', 'error');

                  <div style="font-size:16px;font-weight:800">${Utils.esc(t.name)}</div>

                </div>

/* --- 10. SESSION MANAGER (LIVE TIMERS & START/STOP WORKFLOW) --- */
const SessionManager = {
  findActive(id) { return AppState.data.activeSessions.find(s => s.id === id) || null; },

  calculateCharge(durationMs, hourlyRate, billingMethod) {
    const mins = Math.max(0, durationMs / 60000);
    const method = billingMethod || AppState.data.settings.billingMethod || 'per_minute';
    let charge = 0;
    if (method === 'per_minute') charge = (mins / 60) * hourlyRate;
    else if (method === '30_min') charge = Math.max(1, Math.ceil(mins / 30)) * (hourlyRate / 2);
    else charge = Math.max(1, Math.ceil(mins / 60)) * hourlyRate;
    const minCharge = Number(AppState.data.settings.minSessionCharge) || 0;
    return Utils.round2(Math.max(charge, minCharge));
  },

  quickStartFromTable(tableId) {
    AppState.ui.newSessionTableId = tableId;
    NavigationManager.go('new-session');
  },

  selectCustomer(customerId) {
    AppState.ui.newSessionCustomerId = customerId;
    this.renderNewSessionPage(document.getElementById('workspace'));
  },

  selectTable(tableId) {
    AppState.ui.newSessionTableId = tableId;
    this.renderNewSessionPage(document.getElementById('workspace'));
  },

  startSession() {
    const custId = AppState.ui.newSessionCustomerId;
    const tblId = AppState.ui.newSessionTableId;
    if (!custId) return NotificationManager.toast('Please select or register a customer (or choose Guest).', 'warning');
    if (!tblId) return NotificationManager.toast('Please select an available table.', 'warning');

    const table = TableManager.findById(tblId);
    if (!table || table.status !== 'available' || table.activeSessionId) {
      return NotificationManager.toast('This table is not available.', 'error');
    }

    const cust = custId === 'GUEST' ? { id: 'GUEST', name: 'Walk-in Guest', phone: 'Guest' } : CustomerManager.findById(custId);
    const methodEl = document.getElementById('newSessionBillingMethod');
    const billingMethod = methodEl ? methodEl.value : AppState.data.settings.billingMethod;

    const session = {
      id: Utils.uid('SES'),
      customerId: cust.id,
      customerName: cust.name,
      customerPhone: cust.phone,
      tableId: table.id,
      tableName: table.name,
      startTime: Date.now(),
      endTime: null,
      hourlyRate: table.hourlyRate,
      billingMethod,
      amount: 0,
      status: 'active',
      isDemo: false
    };

    AppState.data.activeSessions.unshift(session);
    table.status = 'occupied';
    table.activeSessionId = session.id;
    StorageManager.saveData();

    AppState.ui.newSessionCustomerId = null;
    AppState.ui.newSessionTableId = null;
    NotificationManager.toast(`Session started on ${table.name} for ${cust.name}.`);
    NavigationManager.go('active-sessions');
  },

  renderNewSessionPage(ws) {
    const availTables = AppState.data.tables.filter(t => t.status === 'available');
    const selTable = TableManager.findById(AppState.ui.newSessionTableId);
    const defaultMethod = AppState.data.settings.billingMethod;

    ws.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Start New Session</div>
          <div class="page-subtitle">Identify customer by phone → Pick available table → Launch live timer</div>
        </div>
      </div>

      <div class="grid" style="gap:18px">
        ${CustomerSearchManager.renderLookupWidget('nsCustLookup', {
          selectedId: AppState.ui.newSessionCustomerId,
          onSelectFnName: 'SessionManager.selectCustomer',
          allowGuest: true
        })}

        <div class="card">
          <div class="card-header">
            <div class="card-title">2. Select Available Table</div>
            <span class="badge badge-success">${availTables.length} Available</span>
          </div>
          ${availTables.length ? `
            <div class="grid grid-auto">
              ${availTables.map(t => {
                const isSel = AppState.ui.newSessionTableId === t.id;
                return `
                  <div class="table-card" style="cursor:pointer;${isSel ? 'border:2px solid var(--brand-emerald);background:var(--brand-emerald-soft)' : ''}" onclick="SessionManager.selectTable('${t.id}')">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                      <strong>${Utils.esc(t.name)}</strong>
                      <span class="badge badge-emerald">${Utils.moneyShort(t.hourlyRate)}/hr</span>

                  </div>`;

            </div>
          ` : '<div class="empty-state">All tables are currently occupied or under maintenance.</div>'}
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">3. Confirm & Start Timer</div></div>
          <div class="form-grid" style="align-items:end">
            <div class="form-group">
              <label class="form-label">Billing Method</label>
              <select class="form-control" id="newSessionBillingMethod">
                <option value="per_minute" ${defaultMethod === 'per_minute' ? 'selected' : ''}>Per Minute (Exact Pro-rata)</option>
                <option value="30_min" ${defaultMethod === '30_min' ? 'selected' : ''}>Every 30 Minutes</option>

                • Min Charge: <strong>${Utils.money(AppState.data.settings.minSessionCharge)}</strong>
              </div>
              <button class="btn btn-primary" style="width:100%;padding:11px" onclick="SessionManager.startSession()">▶ Confirm & Start Live Session</button>
            </div>
          </div>
        </div>
      </div>

                    <div style="font-size:12px;color:var(--text-secondary);display:flex;justify-content:space-between;padding:2px 0">
                      <span>${o.items.map(i => `${i.qty}× ${Utils.esc(i.name)}`).join(', ')}</span>
                      <strong>${Utils.money(o.total)}</strong>
                    </div>
                  `).join('') : '<div style="font-size:12px;color:var(--text-muted)">No refreshments ordered yet.</div>'}
                </div>

                <div style="display:flex;gap:10px">
                  <button class="btn btn-blue" style="flex:1" onclick="POSManager.openForSession('${s.id}')">☕ Add Food / Drink Order</button>
                  <button class="btn btn-danger" style="flex:1" onclick="BillingManager.openSessionCheckout('${s.id}')">⏹ Stop & Combined Bill</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      ` : `<div class="card empty-state"><div class="empty-ico">🎱</div><div>No active snooker or recreation sessions right now.</div><button class="btn btn-primary" style="margin-top:12px" onclick="NavigationManager.go('new-session')">Start First Session</button></div>`}
    `;
  },

  tickLiveTimers() {
    const now = Date.now();
    AppState.data.activeSessions.forEach(s => {
      const elapsed = now - s.startTime;
      const charge = this.calculateCharge(elapsed, s.hourlyRate, s.billingMethod);
      document.querySelectorAll(`[data-live-timer="${s.id}"]`).forEach(el => el.textContent = Utils.formatDuration(elapsed));
      document.querySelectorAll(`[data-live-charge="${s.id}"]`).forEach(el => el.textContent = Utils.money(charge));
    });
  }
};

const InventoryManager = {
  adjustStock(productId, delta, type, note = '') {
    const p = ProductManager.findById(productId);
    if (!p) return false;
    const allowNeg = AppState.data.settings.allowNegativeStock;
    if (!allowNeg && p.stock + delta < 0) return false;
    p.stock += delta;
    AppState.data.inventoryLogs.unshift({
      id: Utils.uid('INVLOG'), productId: p.id, productName: p.name,
      type, qty: delta, note, createdAt: Date.now()
    });
    return true;
  },
  openAdjustModal(productId) {
    const p = ProductManager.findById(productId);
    if (!p) return;
    NotificationManager.openModal(
      `Adjust Stock — ${p.name}`,
      `<form id="stockForm" class="form-grid">
        <div class="form-group"><label class="form-label">Action</label>
          <select class="form-control" name="type">
            <option value="Purchase">Stock Addition / Purchase (+)</option>
            <option value="Adjustment">Manual Deduction (-)</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Quantity *</label><input class="form-control" type="number" min="1" name="qty" required value="10" /></div>
        <div class="form-group full"><label class="form-label">Note</label><input class="form-control" name="note" placeholder="Supplier invoice / wastage / recount" /></div>

      `<button class="btn btn-outline" onclick="NotificationManager.closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="InventoryManager.submitAdjust('${productId}')">Update Stock</button>`
    );

    NotificationManager.toast('Inventory updated.');

/* --- 12. CART & POS MANAGER --- */
const CartManager = {
  add(productId) {
    const p = ProductManager.findById(productId);
    if (!p || !p.enabled) return;
    const existing = AppState.ui.posCart.find(i => i.productId === productId);
    const nextQty = (existing ? existing.qty : 0) + 1;
    if (!AppState.data.settings.allowNegativeStock && nextQty > p.stock) {
      return NotificationManager.toast(`Only ${p.stock} ${p.name} in stock.`, 'warning');
    }
    if (existing) { existing.qty = nextQty; existing.total = Utils.round2(existing.qty * existing.price); }
    else AppState.ui.posCart.push({ productId: p.id, name: p.name, categoryId: p.categoryId, price: p.price, qty: 1, total: p.price });
    POSManager.render(document.getElementById('workspace'));
  },
  changeQty(productId, delta) {
    const item = AppState.ui.posCart.find(i => i.productId === productId);
    if (!item) return;
    const p = ProductManager.findById(productId);
    const next = item.qty + delta;
    if (next <= 0) AppState.ui.posCart = AppState.ui.posCart.filter(i => i.productId !== productId);
    else {
      if (delta > 0 && p && !AppState.data.settings.allowNegativeStock && next > p.stock) {
        return NotificationManager.toast(`Only ${p.stock} in stock.`, 'warning');
      }
      item.qty = next; item.total = Utils.round2(item.qty * item.price);
    }
    POSManager.render(document.getElementById('workspace'));
  },
  clear() {
    AppState.ui.posCart = [];
    AppState.ui.posOfferId = '';
    AppState.ui.posRedeemPoints = 0;
  }
};

const POSManager = {
  openForSession(sessionId) {
    const ses = SessionManager.findActive(sessionId);
    if (!ses) return;
    AppState.ui.posLinkedSessionId = ses.id;
    AppState.ui.posCustomerId = ses.customerId;
    CartManager.clear();
    NavigationManager.go('pos');
  },

  selectCustomer(custId) {
    AppState.ui.posCustomerId = custId;
    AppState.ui.posLinkedSessionId = null;
    this.render(document.getElementById('workspace'));
  },

  unlinkSession() {
    AppState.ui.posLinkedSessionId = null;
    this.render(document.getElementById('workspace'));
  },

  checkout() {
    const cart = AppState.ui.posCart;
    if (!cart.length) return NotificationManager.toast('Cart is empty.', 'warning');

    // Verify stock
    for (const item of cart) {
      const p = ProductManager.findById(item.productId);
      if (p && !AppState.data.settings.allowNegativeStock && p.stock < item.qty) {
        return NotificationManager.toast(`Insufficient stock for ${p.name}.`, 'error');
      }
    }

    const linkedSes = AppState.ui.posLinkedSessionId ? SessionManager.findActive(AppState.ui.posLinkedSessionId) : null;
    const custId = linkedSes ? linkedSes.customerId : (AppState.ui.posCustomerId || 'GUEST');
    const cust = custId === 'GUEST' ? { id: 'GUEST', name: 'Walk-in Guest', phone: 'Guest' } : CustomerManager.findById(custId);

    const subtotal = Utils.round2(cart.reduce((s, i) => s + i.total, 0));

    // Deduct stock immediately upon confirmed order
    cart.forEach(item => InventoryManager.adjustStock(item.productId, -item.qty, 'Sale', linkedSes ? `Session ${linkedSes.tableName}` : 'POS Order'));

    const order = {
      id: Utils.uid('ORD'),
      customerId: cust.id,
      customerName: cust.name,
      customerPhone: cust.phone,
      sessionId: linkedSes ? linkedSes.id : null,
      tableName: linkedSes ? linkedSes.tableName : 'Walk-in Café',
      items: cart.map(i => ({ ...i })),
      total: subtotal,
      createdAt: Date.now(),
      orderStatus: linkedSes ? 'Preparing' : 'Completed',
      paymentStatus: linkedSes ? 'Unbilled' : 'Paid',
      invoiceId: null,
      isDemo: false
    };
    AppState.data.orders.unshift(order);

    // If linked to active session: save order to session (billed later when session stops!)
    if (linkedSes) {
      StorageManager.saveData();
      CartManager.clear();
      AppState.ui.posLinkedSessionId = null;
      NotificationManager.toast(`Order added to ${linkedSes.tableName} (${linkedSes.customerName}). Will be combined in final bill.`);
      NavigationManager.go('active-sessions');
      return;
    }

    // Standalone café checkout: generate invoice & payment immediately
    const offerId = AppState.ui.posOfferId;
    const offerRes = OfferManager.applyOffer(offerId, subtotal, 'cafe');
    const redeemPts = Number(AppState.ui.posRedeemPoints) || 0;
    const loyaltyDiscount = LoyaltyManager.calculateRedemptionValue(cust.id, redeemPts);
    const discounted = Math.max(0, subtotal - offerRes.discount - loyaltyDiscount);
    const taxRate = Number(AppState.data.settings.taxRate) || 0;
    const taxAmount = Utils.round2((discounted * taxRate) / 100);
    const grandTotal = Utils.round2(discounted + taxAmount);

    const paidInput = document.getElementById('posPaidAmount');
    const amountPaid = Utils.round2(Math.min(grandTotal, Math.max(0, Number(paidInput ? paidInput.value : grandTotal))));
    const method = AppState.ui.posPaymentMethod || 'UPI';

    const inv = BillingManager.createInvoice({
      customerId: cust.id, customerName: cust.name, customerPhone: cust.phone,
      sessionId: null, tableName: 'Walk-in Café', sessionDurationMs: 0, sessionCharge: 0,
      orderIds: [order.id], items: order.items, cafeCharge: subtotal,
      subtotal, discount: offerRes.discount, appliedOfferId: offerRes.offer ? offerRes.offer.id : null,
      appliedOfferName: offerRes.offer ? offerRes.offer.name : '',
      loyaltyDiscount, redeemPts, taxRate, taxAmount, grandTotal, amountPaid, paymentMethod: method
    });

    order.invoiceId = inv.id;
    order.paymentStatus = inv.paymentStatus;
    StorageManager.saveData();

    CartManager.clear();
    AppState.ui.posCustomerId = null;
    NotificationManager.toast(`Invoice ${inv.id} created!`);
    NavigationManager.render();
    InvoiceManager.openInvoiceModal(inv.id);
  },

  render(ws) {
    const d = AppState.data;
    const linkedSes = AppState.ui.posLinkedSessionId ? SessionManager.findActive(AppState.ui.posLinkedSessionId) : null;
    const prods = d.products.filter(p =>
      p.enabled &&
      (AppState.ui.posCategory === 'ALL' || p.categoryId === AppState.ui.posCategory) &&
      (!AppState.ui.posSearch || p.name.toLowerCase().includes(AppState.ui.posSearch.toLowerCase()))
    );

    const cart = AppState.ui.posCart;
    const subtotal = Utils.round2(cart.reduce((s, i) => s + i.total, 0));
    const eligibleOffers = OfferManager.getEligibleOffers(subtotal, 'cafe');
    const offerRes = OfferManager.applyOffer(AppState.ui.posOfferId, subtotal, 'cafe');
    const cust = AppState.ui.posCustomerId && AppState.ui.posCustomerId !== 'GUEST' ? CustomerManager.findById(AppState.ui.posCustomerId) : null;
    const loyaltyDiscount = cust ? LoyaltyManager.calculateRedemptionValue(cust.id, AppState.ui.posRedeemPoints) : 0;
    const afterDisc = Math.max(0, subtotal - offerRes.discount - loyaltyDiscount);
    const taxRate = Number(d.settings.taxRate) || 0;
    const taxAmount = Utils.round2((afterDisc * taxRate) / 100);
    const grandTotal = Utils.round2(afterDisc + taxAmount);

    ws.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">POS / Café Billing</div>
          <div class="page-subtitle">Standalone café checkout or add refreshments directly to an active snooker session</div>
        </div>
        ${d.activeSessions.length && !linkedSes ? `
          <div class="page-actions">
            <select class="form-control" style="width:auto" onchange="if(this.value) POSManager.openForSession(this.value)">
              <option value="">Attach to Active Session...</option>
              ${d.activeSessions.map(s => `<option value="${s.id}">${Utils.esc(s.tableName)} — ${Utils.esc(s.customerName)}</option>`).join('')}
            </select>
          </div>` : ''}
      </div>

      ${linkedSes ? `
        <div class="card" style="margin-bottom:16px;background:var(--accent-orange-soft);border-color:var(--accent-orange);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">

const LoyaltyManager = {
  calculateRedemptionValue(customerId, points) {
    const s = AppState.data.settings;
    if (!s.loyaltyEnabled || !customerId || customerId === 'GUEST') return 0;
    const c = CustomerManager.findById(customerId);
    if (!c) return 0;
    const usable = Math.min(c.loyaltyPoints || 0, Math.max(0, Number(points) || 0));
    return Utils.round2(usable * (Number(s.loyaltyPointValue) || 1));
  },
  awardAndRedeem(customerId, grandTotal, redeemedPts, invoiceId) {
    const s = AppState.data.settings;
    if (!s.loyaltyEnabled || !customerId || customerId === 'GUEST') return;
    const c = CustomerManager.findById(customerId);
    if (!c) return;
    if (redeemedPts > 0) {
      const actual = Math.min(c.loyaltyPoints || 0, redeemedPts);
      c.loyaltyPoints = Math.max(0, (c.loyaltyPoints || 0) - actual);
      AppState.data.loyaltyLogs.unshift({ id: Utils.uid('LOY'), customerId: c.id, customerName: c.name, points: -actual, type: 'Redeemed', note: `Invoice ${invoiceId}`, createdAt: Date.now() });
    }
    const spendPerPt = Number(s.loyaltySpendPerPoint) || 100;
    const earned = Math.floor(grandTotal / spendPerPt);
    if (earned > 0) {
      c.loyaltyPoints = (c.loyaltyPoints || 0) + earned;
      AppState.data.loyaltyLogs.unshift({ id: Utils.uid('LOY'), customerId: c.id, customerName: c.name, points: earned, type: 'Earned', note: `Invoice ${invoiceId}`, createdAt: Date.now() });
    }
  }
};

const OfferManager = {
  isValidNow(offer) {
    if (!offer || !offer.active) return false;
    const today = Utils.toISODate();
    if (offer.startDate && today < offer.startDate) return false;
    if (offer.endDate && today > offer.endDate) return false;
    if (offer.usageLimit > 0 && offer.usedCount >= offer.usageLimit) return false;
    return true;
  },
  getEligibleOffers(subtotal, scope = 'all') {
    return AppState.data.offers.filter(o =>
      this.isValidNow(o) &&
      subtotal >= (Number(o.minBill) || 0) &&
      (o.targetScope === 'all' || o.targetScope === scope || scope === 'combined')
    );
  },
  getCustomerAvailableOffers(cust, totalVisits) {
    if (!cust) return [];
    const todayMD = Utils.toISODate().slice(5);
    const isBday = cust.birthday && cust.birthday.slice(5) === todayMD;
    return AppState.data.offers.filter(o => {
      if (!this.isValidNow(o)) return false;
      if (o.customerTag === 'returning' && totalVisits < 2) return false;
      if (o.customerTag === 'birthday' && !isBday) return false;
      return true;
    });
  },
  applyOffer(offerId, subtotal, scope = 'all') {
    if (!offerId) return { discount: 0, offer: null };
    const offer = this.getEligibleOffers(subtotal, scope).find(o => o.id === offerId);
    if (!offer) return { discount: 0, offer: null };
    let disc = offer.discountMode === 'percent' ? (subtotal * offer.discountValue) / 100 : offer.discountValue;
    if (offer.maxDiscount > 0) disc = Math.min(disc, offer.maxDiscount);
    disc = Utils.round2(Math.min(disc, subtotal));
    return { discount: disc, offer };
  },
  openOfferModal(offerId = null, prefillFestivalId = '') {
    const o = offerId ? AppState.data.offers.find(x => x.id === offerId) : null;
    const fest = prefillFestivalId ? AppState.data.festivals.find(f => f.id === prefillFestivalId) : null;

        <div class="form-group"><label class="form-label">Offer Type</label>
          <select class="form-control" name="type">
            ${['Discount', 'New Arrival', "Today's Special", 'Festival Offer', 'Loyalty Offer', 'Combo Offer', 'Session Discount', 'Product-Specific'].map(t => `<option value="${t}" ${(o && o.type === t) || (fest && t === 'Festival Offer') ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="form-group full"><label class="form-label">Promotional Headline *</label><input class="form-control" name="headline" required value="${Utils.esc(o ? o.headline : (fest ? fest.name + ' Mega Offer at CROWNS CUE!' : ''))}" /></div>
        <div class="form-group full"><label class="form-label">Offer Details</label><textarea class="form-control" name="description">${Utils.esc(o ? o.description : (fest ? fest.template : ''))}</textarea></div>
        <div class="form-group"><label class="form-label">Start Date</label><input class="form-control" type="date" name="startDate" value="${o ? o.startDate : (fest ? fest.date : today)}" /></div>
        <div class="form-group"><label class="form-label">Valid Until *</label><input class="form-control" type="date" name="endDate" required value="${o ? o.endDate : Utils.toISODate(Date.now() + 15 * 86400000)}" /></div>

      targetScope: fd.get('targetScope'),
      customerTag: fd.get('customerTag'),
      usageLimit: Number(fd.get('usageLimit')) || 0,
      active: fd.get('active') === 'on'

    if (offerId) Object.assign(AppState.data.offers.find(x => x.id === offerId), payload);

/* --- 15. BILLING, INVOICE & PAYMENT MANAGERS --- */
const BillingManager = {
  generateInvoiceNumber() {
    const year = new Date().getFullYear();
    const num = AppState.data.settings.invoiceCounter || (AppState.data.invoices.length + 1);
    AppState.data.settings.invoiceCounter = num + 1;
    return `INV-${year}-${String(num).padStart(4, '0')}`;
  },

  createInvoice(payload) {
    const invId = this.generateInvoiceNumber();
    const pendingBalance = Utils.round2(Math.max(0, payload.grandTotal - payload.amountPaid));
    const paymentStatus = pendingBalance === 0 ? 'Paid' : (payload.amountPaid > 0 ? 'Partial' : 'Pending');

    const invoice = {
      id: invId,
      customerId: payload.customerId,
      customerName: payload.customerName,
      customerPhone: payload.customerPhone,
      sessionId: payload.sessionId,
      tableName: payload.tableName,
      sessionDurationMs: payload.sessionDurationMs || 0,
      sessionCharge: payload.sessionCharge || 0,
      orderIds: payload.orderIds || [],
      items: payload.items || [],
      cafeCharge: payload.cafeCharge || 0,
      subtotal: payload.subtotal,
      discount: payload.discount || 0,
      appliedOfferId: payload.appliedOfferId || null,
      appliedOfferName: payload.appliedOfferName || '',
      loyaltyDiscount: payload.loyaltyDiscount || 0,
      taxRate: payload.taxRate || 0,
      taxAmount: payload.taxAmount || 0,
      grandTotal: payload.grandTotal,
      amountPaid: payload.amountPaid,
      pendingBalance,
      paymentStatus,
      paymentMethod: payload.paymentMethod,
      createdAt: Date.now(),
      isDemo: false
    };

    AppState.data.invoices.unshift(invoice);

    if (payload.appliedOfferId) {
      const ofr = AppState.data.offers.find(o => o.id === payload.appliedOfferId);
      if (ofr) ofr.usedCount = (ofr.usedCount || 0) + 1;
    }

    if (payload.amountPaid > 0) {
      AppState.data.payments.unshift({
        id: Utils.uid('PAY'),
        invoiceId: invId,
        customerId: payload.customerId,
        customerName: payload.customerName,
        amount: payload.amountPaid,
        method: payload.paymentMethod,
        type: 'payment',
        note: pendingBalance > 0 ? 'Partial payment at checkout' : 'Full payment at checkout',
        createdAt: Date.now(),
        isDemo: false
      });
    }

    LoyaltyManager.awardAndRedeem(payload.customerId, payload.grandTotal, payload.redeemPts || 0, invId);
    return invoice;
  },

  openSessionCheckout(sessionId) {
    const ses = SessionManager.findActive(sessionId);
    if (!ses) return;
    const endTime = Date.now();
    const durationMs = endTime - ses.startTime;
    const sessionCharge = SessionManager.calculateCharge(durationMs, ses.hourlyRate, ses.billingMethod);
    const linkedOrders = AppState.data.orders.filter(o => o.sessionId === ses.id && o.orderStatus !== 'Cancelled');
    const items = [];
    linkedOrders.forEach(o => o.items.forEach(it => items.push({ ...it })));
    const cafeCharge = Utils.round2(items.reduce((s, i) => s + i.total, 0));
    const subtotal = Utils.round2(sessionCharge + cafeCharge);
    const eligibleOffers = OfferManager.getEligibleOffers(subtotal, 'combined');
    const cust = ses.customerId !== 'GUEST' ? CustomerManager.findById(ses.customerId) : null;

    this._checkoutCtx = { sessionId, endTime, durationMs, sessionCharge, linkedOrders, items, cafeCharge, subtotal, cust };

    const html = `
      <div style="background:var(--bg-subtle);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:14px;margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px">
          <span>🎱 ${Utils.esc(ses.tableName)} — ${Utils.esc(ses.customerName)}</span>
          <span>${Utils.formatDuration(durationMs)}</span>
        </div>
        <div style="font-size:12.5px;color:var(--text-secondary)">Started ${Utils.formatTime(ses.startTime)} → Stopped ${Utils.formatTime(endTime)} • Rate ${Utils.moneyShort(ses.hourlyRate)}/hr</div>
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-weight:700">
          <span>Session Charge</span><span>${Utils.money(sessionCharge)}</span>
        </div>
      </div>

      ${items.length ? `
        <div style="margin-bottom:14px">
          <div style="font-weight:700;font-size:13px;margin-bottom:6px">Café Orders Combined (${linkedOrders.length})</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead>
              <tbody>${items.map(i => `<tr><td>${Utils.esc(i.name)}</td><td>${i.qty}</td><td>${Utils.money(i.price)}</td><td><strong>${Utils.money(i.total)}</strong></td></tr>`).join('')}</tbody>
            </table>
          </div>
        </div>` : '<div style="font-size:12.5px;color:var(--text-secondary);margin-bottom:14px">No café orders linked to this session.</div>'}

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Apply Active Offer (${eligibleOffers.length} eligible)</label>
          <select class="form-control" id="chkOffer" onchange="BillingManager.recalcSessionCheckout()">
            <option value="">No Offer</option>
            ${eligibleOffers.map(o => `<option value="${o.id}">${Utils.esc(o.name)} (${o.discountMode === 'percent' ? o.discountValue + '%' : Utils.moneyShort(o.discountValue)})</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Redeem Loyalty Points ${cust ? `(Avail: ${cust.loyaltyPoints || 0})` : '(Guest)'}</label>
          <input class="form-control" id="chkPoints" type="number" min="0" max="${cust ? (cust.loyaltyPoints || 0) : 0}" value="0" ${!cust || !AppState.data.settings.loyaltyEnabled ? 'disabled' : ''} oninput="BillingManager.recalcSessionCheckout()" />
        </div>
        <div class="form-group">
          <label class="form-label">Payment Method</label>
          <select class="form-control" id="chkMethod">
            <option value="UPI">UPI</option>
            <option value="Cash">Cash</option>
            <option value="Card / Other">Card / Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Amount Paid Now (₹ — supports partial)</label>
          <input class="form-control" id="chkPaid" type="number" step="0.01" min="0" value="${subtotal}" />
        </div>
      </div>

      <div id="chkSummary" style="margin-top:16px;padding:14px;border-radius:var(--radius-md);background:var(--brand-emerald-soft);border:1px solid var(--brand-emerald)"></div>
    `;

    NotificationManager.openModal(
      'Stop Session & Combined Checkout',
      html,
      `<button class="btn btn-outline" onclick="NotificationManager.closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="BillingManager.finalizeSessionCheckout()">✓ Confirm Payment & Generate Invoice</button>`,
      true
    );
    this.recalcSessionCheckout(true);
  },

  recalcSessionCheckout(syncPaid = false) {
    const ctx = this._checkoutCtx;
    const offerId = document.getElementById('chkOffer').value;
    const redeemPts = Number(document.getElementById('chkPoints').value) || 0;
    const offerRes = OfferManager.applyOffer(offerId, ctx.subtotal, 'combined');
    const loyaltyDiscount = ctx.cust ? LoyaltyManager.calculateRedemptionValue(ctx.cust.id, redeemPts) : 0;
    const afterDisc = Math.max(0, ctx.subtotal - offerRes.discount - loyaltyDiscount);
    const taxRate = Number(AppState.data.settings.taxRate) || 0;
    const taxAmount = Utils.round2((afterDisc * taxRate) / 100);
    const grandTotal = Utils.round2(afterDisc + taxAmount);

    if (syncPaid) document.getElementById('chkPaid').value = grandTotal;
    document.getElementById('chkSummary').innerHTML = `
      <div class="receipt-row"><span>Session + Café Subtotal</span><strong>${Utils.money(ctx.subtotal)}</strong></div>
      ${offerRes.discount > 0 ? `<div class="receipt-row" style="color:var(--success)"><span>Offer (${Utils.esc(offerRes.offer.name)})</span><strong>−${Utils.money(offerRes.discount)}</strong></div>` : ''}
      ${loyaltyDiscount > 0 ? `<div class="receipt-row"><span>Loyalty Redemption</span><strong>−${Utils.money(loyaltyDiscount)}</strong></div>` : ''}
      ${taxAmount > 0 ? `<div class="receipt-row"><span>Tax (${taxRate}%)</span><strong>${Utils.money(taxAmount)}</strong></div>` : ''}
      <div class="receipt-row" style="font-size:18px;font-weight:800;margin-top:6px;color:var(--brand-emerald)"><span>Grand Total</span><span>${Utils.money(grandTotal)}</span></div>
    `;
  },

  finalizeSessionCheckout() {
    const ctx = this._checkoutCtx;
    const ses = SessionManager.findActive(ctx.sessionId);
    if (!ses) return NotificationManager.toast('Session already closed.', 'error');

    const offerId = document.getElementById('chkOffer').value;
    const redeemPts = Number(document.getElementById('chkPoints').value) || 0;
    const method = document.getElementById('chkMethod').value;
    const offerRes = OfferManager.applyOffer(offerId, ctx.subtotal, 'combined');
    const loyaltyDiscount = ctx.cust ? LoyaltyManager.calculateRedemptionValue(ctx.cust.id, redeemPts) : 0;
    const afterDisc = Math.max(0, ctx.subtotal - offerRes.discount - loyaltyDiscount);
    const taxRate = Number(AppState.data.settings.taxRate) || 0;
    const taxAmount = Utils.round2((afterDisc * taxRate) / 100);
    const grandTotal = Utils.round2(afterDisc + taxAmount);
    const amountPaid = Utils.round2(Math.min(grandTotal, Math.max(0, Number(document.getElementById('chkPaid').value) || 0)));

    // 1. Create Invoice
    const inv = this.createInvoice({
      customerId: ses.customerId, customerName: ses.customerName, customerPhone: ses.customerPhone,
      sessionId: ses.id, tableName: ses.tableName, sessionDurationMs: ctx.durationMs,
      sessionCharge: ctx.sessionCharge, orderIds: ctx.linkedOrders.map(o => o.id),
      items: ctx.items, cafeCharge: ctx.cafeCharge, subtotal: ctx.subtotal,
      discount: offerRes.discount, appliedOfferId: offerRes.offer ? offerRes.offer.id : null,
      appliedOfferName: offerRes.offer ? offerRes.offer.name : '',
      loyaltyDiscount, redeemPts, taxRate, taxAmount, grandTotal, amountPaid, paymentMethod: method
    });

    // 2. Move session to completed & release table
    ses.endTime = ctx.endTime;
    ses.durationMs = ctx.durationMs;
    ses.amount = ctx.sessionCharge;
    ses.status = 'completed';
    ses.invoiceId = inv.id;

    AppState.data.completedSessions.unshift(ses);
    AppState.data.activeSessions = AppState.data.activeSessions.filter(x => x.id !== ses.id);

    const table = TableManager.findById(ses.tableId);
    if (table) { table.status = 'available'; table.activeSessionId = null; }

    // 3. Mark linked orders billed & completed
    ctx.linkedOrders.forEach(o => {
      o.orderStatus = 'Completed';
      o.paymentStatus = inv.paymentStatus;
      o.invoiceId = inv.id;
    });

    StorageManager.saveData();
    NotificationManager.closeModal();
    NotificationManager.toast(`Session stopped & Invoice ${inv.id} generated!`);
    NavigationManager.render();
    InvoiceManager.openInvoiceModal(inv.id);
  }
};

const PaymentManager = {
  openCollectModal(invoiceId) {
    const inv = AppState.data.invoices.find(i => i.id === invoiceId);
    if (!inv || inv.pendingBalance <= 0) return;
    NotificationManager.openModal(
      `Collect Balance — ${inv.id}`,
      `<form id="payForm" class="form-grid">
        <div class="form-group full" style="background:var(--bg-subtle);padding:10px 12px;border-radius:6px">
          Customer: <strong>${Utils.esc(inv.customerName)}</strong> • Pending Balance: <strong style="color:var(--danger)">${Utils.money(inv.pendingBalance)}</strong>
        </div>
        <div class="form-group"><label class="form-label">Amount Received (₹) *</label><input class="form-control" type="number" step="0.01" min="0.01" max="${inv.pendingBalance}" name="amount" required value="${inv.pendingBalance}" /></div>
        <div class="form-group"><label class="form-label">Payment Method</label>
          <select class="form-control" name="method"><option value="UPI">UPI</option><option value="Cash">Cash</option><option value="Card / Other">Card / Other</option></select>
        </div>
        <div class="form-group full"><label class="form-label">Note</label><input class="form-control" name="note" placeholder="Balance settled" /></div>
      </form>`,
      `<button class="btn btn-outline" onclick="NotificationManager.closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="PaymentManager.recordPayment('${invoiceId}')">Record Payment</button>`
    );
  },
  recordPayment(invoiceId) {
    const inv = AppState.data.invoices.find(i => i.id === invoiceId);
    const fd = new FormData(document.getElementById('payForm'));
    const amount = Utils.round2(Number(fd.get('amount')));
    if (!amount || amount <= 0 || amount > inv.pendingBalance + 0.01) return NotificationManager.toast('Enter valid payment amount.', 'error');
    inv.amountPaid = Utils.round2(inv.amountPaid + amount);
    inv.pendingBalance = Utils.round2(Math.max(0, inv.grandTotal - inv.amountPaid));
    inv.paymentStatus = inv.pendingBalance === 0 ? 'Paid' : 'Partial';
    AppState.data.payments.unshift({
      id: Utils.uid('PAY'), invoiceId: inv.id, customerId: inv.customerId, customerName: inv.customerName,
      amount, method: fd.get('method'), type: 'payment', note: fd.get('note') || 'Balance collection', createdAt: Date.now(), isDemo: false
    });
    StorageManager.saveData();
    NotificationManager.closeModal();
    NotificationManager.toast(`Recorded ${Utils.money(amount)} for ${inv.id}.`);
    NavigationManager.render();

    const paidInvs = AppState.data.invoices.filter(i => i.amountPaid > 0);
